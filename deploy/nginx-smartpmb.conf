# Two virtual hosts on the same VM/IP, using sslip.io "magic" hostnames so
# Let's Encrypt has something real to issue a certificate for even without
# an owned domain (anything.<ip>.sslip.io resolves straight back to <ip>).
#
# Replace APP_HOST / API_HOST / deploy_user below before use:
#   sudo sed -i \
#     -e 's/APP_HOST/app.<your-vm-ip>.sslip.io/g' \
#     -e 's/API_HOST/api.<your-vm-ip>.sslip.io/g' \
#     -e 's/deploy_user/<your-linux-username>/g' \
#     /etc/nginx/sites-available/smartpmb
#
# APP_HOST -> Next.js frontend (port 3000)
# API_HOST -> Django backend (port 8000), + serves /static/ and /media/
#             straight off disk instead of proxying them through Gunicorn.
#
# IMPORTANT — this file includes the `listen 443 ssl` blocks and the
# HTTP->HTTPS redirect server blocks that Certbot (Let's Encrypt) generates
# automatically. If you're re-deploying onto a VM that already has a
# Certbot-managed config with a real, issued certificate, do NOT blindly
# `cp` this file over the live one — it'll overwrite the live
# ssl_certificate paths with placeholder-adjacent ones that may not match
# your actual cert, or (if you skip the sed step) leave literal
# "APP_HOST"/"API_HOST" strings as server_name, silently breaking routing
# even though `nginx -t` still passes (a literal string is syntactically
# valid as a server_name). After copying, always re-apply the existing
# cert rather than trusting the copied SSL block as-is:
#   sudo certbot install --cert-name <your-cert-name>   # `certbot certificates` shows the name
#   sudo nginx -t && sudo systemctl reload nginx
# On a genuinely fresh VM with no certificate yet, skip that and instead
# run `sudo certbot --nginx -d APP_HOST -d API_HOST` once the HTTP-only
# version of this config is in place — it'll obtain the cert and rewrite
# this file with the same blocks shown below automatically.

# Only treat the connection as a protocol upgrade (WebSocket/HMR) when the
# client actually sent an Upgrade header. Hardcoding "Connection: upgrade"
# on every request -- including plain POST/GET, e.g. every Next.js Server
# Action call -- confuses HTTP/1.1 keep-alive on the upstream and causes
# requests to hang or fail intermittently instead of completing normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name APP_HOST;

    # Profile pictures and license-application documents are uploaded
    # through Next.js Server Actions (POST straight to a page route, not
    # the API_HOST), so this needs its own limit -- nginx's 1M default
    # otherwise rejects them with a bare 413 before the request even
    # reaches Next.js, which the client then can't parse as a proper
    # Server Action response (surfaces as an uncaught JS error, not a
    # clean form error). Matches API_HOST's existing client_max_body_size
    # and next.config.ts's serverActions.bodySizeLimit below.
    client_max_body_size 20M;

    # Real-time notification WebSocket (see notifications/consumers.py +
    # deploy/daphne.service) -- routed under APP_HOST specifically, not
    # API_HOST, because the access_token cookie the WS handshake needs is
    # scoped to this app's own origin, not Django's (two separate hosts).
    # /internal/ws-push/ deliberately gets no location here at all -- it
    # must stay unreachable from the public internet, exactly like
    # gunicorn's own port 8000 (see accounts/signals.py, the only caller,
    # which always calls it over 127.0.0.1 directly).
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived -- Nginx's default 60s
        # proxy_read_timeout would silently kill an idle-but-healthy socket.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx's default header buffer (a few KB) is too small for
        # Set-Cookie headers carrying full JWTs -- this app bakes each
        # user's role/permissions list into the token, and impersonation
        # sends two such cookies at once (the admin's stashed token +
        # the target's new one). Too-small buffers surface as a 502
        # ("upstream sent too big header") rather than a clear error.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/APP_HOST/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name API_HOST;

    client_max_body_size 20M;

    location /static/ {
        alias /home/deploy_user/smart-pmb/Smart_pmb_backend/pmb_bk/staticfiles/;
    }

    location /media/ {
        alias /home/deploy_user/smart-pmb/Smart_pmb_backend/pmb_bk/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same certificate as the APP_HOST block above -- Certbot issued one
    # cert covering both hostnames as SANs (see `certbot certificates`),
    # rather than two separate certificates, so this deliberately points
    # at the APP_HOST cert path, not a separate API_HOST one.
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/APP_HOST/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = APP_HOST) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name APP_HOST;
    return 404; # managed by Certbot
}

server {
    if ($host = API_HOST) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name API_HOST;
    return 404; # managed by Certbot
}
