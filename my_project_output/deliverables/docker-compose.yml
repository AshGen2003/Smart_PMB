services:
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && gunicorn smart_pmb.wsgi:application -c gunicorn.conf.py"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - pmb_db:/app/db.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; http.client.HTTPConnection('localhost', 8000).request('GET', '/api/auth/me/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pmb_db:
